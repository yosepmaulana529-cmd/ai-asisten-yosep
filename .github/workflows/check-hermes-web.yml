name: Check Hermes AI web portal

on:
  push:
    paths:
      - "hermes-web/**"
      - ".github/workflows/check-hermes-web.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r hermes-web/requirements.txt
      - name: Compile Python backend
        run: python -m py_compile hermes-web/app.py
      - name: Check service imports
        run: python -c "import sys; sys.path.insert(0, 'hermes-web'); import app; print('FastAPI app loaded')"
