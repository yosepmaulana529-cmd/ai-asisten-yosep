name: Deploy AI Asisten Yosep to Cloudflare

on:
  workflow_dispatch:
  push:
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare.yml"
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve Cloudflare account ID
        id: resolve
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN" && exit 1)
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Account ID secret is absent; attempting to discover it with the existing API token."
            RESPONSE="$(curl --fail --silent --show-error --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts)"
            CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$RESPONSE" | jq -er '.result[0].id')"
          fi
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Could not resolve Cloudflare account ID; add CLOUDFLARE_ACCOUNT_ID repository secret." && exit 1)
          echo "account_id=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "Cloudflare account ID resolved."


      - name: Install Wrangler
        run: npm install

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.resolve.outputs.account_id }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.resolve.outputs.account_id }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
        run: |
          if [ -z "$OWNER_EMAIL" ]; then
            echo "GitHub repository variable OWNER_EMAIL is not set; admin role will not be assigned automatically."
          fi
          npx wrangler deploy --var "OWNER_EMAIL:$OWNER_EMAIL" --var "DAILY_MESSAGE_LIMIT:50"

      - name: Smoke test deployed app
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "Set repository variable WORKER_URL to the deployed https://<worker>.<subdomain>.workers.dev URL to enable smoke test."
            exit 0
          fi
          curl --fail --silent --show-error "$WORKER_URL/api/health"
