name: Deploy AI Asisten Yosep to Cloudflare

on:
  workflow_dispatch:
  push:
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare.yml"
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$D1_DATABASE_ID" || (echo "Missing GitHub secret: D1_DATABASE_ID" && exit 1)
          test "${#SESSION_SECRET}" -ge 32 || (echo "SESSION_SECRET must contain at least 32 characters" && exit 1)
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/" wrangler.jsonc
          echo "Deployment configuration validated."

      - name: Install Wrangler
        run: npm install

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
        run: |
          if [ -z "$OWNER_EMAIL" ]; then
            echo "GitHub repository variable OWNER_EMAIL is not set; admin role will not be assigned automatically."
          fi
          npx wrangler secret put SESSION_SECRET <<< "$SESSION_SECRET"
          npx wrangler deploy --var "OWNER_EMAIL:$OWNER_EMAIL" --var "DAILY_MESSAGE_LIMIT:50"

      - name: Smoke test deployed app
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "Set repository variable WORKER_URL to the deployed https://<worker>.<subdomain>.workers.dev URL to enable smoke test."
            exit 0
          fi
          curl --fail --silent --show-error "$WORKER_URL/api/health"
